# Builds both apps and publishes them as a GitHub Release when a version tag is pushed:
#
#   git tag v1.3.0 && git push origin v1.3.0
name: Release

on:
  push:
    tags: ["v*.*.*"]

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - id: v
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! $TAG =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag '$TAG' must look like v1.2.3"
            exit 1
          fi
          # v1.3.0 -> 10300: always goes up as the version goes up (minor and patch must stay below 100).
          code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android
      # Every release must be signed with the same key, or phones refuse to install it as an update.
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ATTEND_KEYSTORE_BASE64 }}
        run: |
          if [[ -z $KEYSTORE_BASE64 ]]; then
            echo "::error::The ATTEND_KEYSTORE_BASE64 secret isn't set. Releases need a stable signing key; see Signing in the README."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
      - name: Assemble release APKs
        env:
          ATTEND_KEYSTORE_FILE: release.jks
          ATTEND_KEYSTORE_PASSWORD: ${{ secrets.ATTEND_KEYSTORE_PASSWORD }}
          ATTEND_KEY_ALIAS: ${{ secrets.ATTEND_KEY_ALIAS }}
          ATTEND_KEY_PASSWORD: ${{ secrets.ATTEND_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --console=plain \
            -PversionName=${{ needs.version.outputs.name }} -PversionCode=${{ needs.version.outputs.code }}
      - name: Rename APKs
        run: |
          mkdir -p dist
          for f in app/build/outputs/apk/release/app-*-release.apk; do
            abi=${f##*/app-}
            cp "$f" "dist/Attend-${{ needs.version.outputs.name }}-${abi%-release.apk}.apk"
          done
          ls dist
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: android/dist/*.apk

  ios:
    needs: version
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      # No Apple developer account, so the app is built unsigned. Sideloading tools (AltStore,
      # SideStore) sign it with the user's own Apple ID when they install it.
      - name: Archive
        run: |
          xcodebuild -project Attend.xcodeproj -scheme Attend -configuration Release \
            -destination generic/platform=iOS -archivePath build/Attend.xcarchive \
            MARKETING_VERSION=${{ needs.version.outputs.name }} \
            CURRENT_PROJECT_VERSION=${{ needs.version.outputs.code }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            archive
      - name: Package unsigned IPA
        run: |
          mkdir -p dist/Payload
          cp -R build/Attend.xcarchive/Products/Applications/Attend.app dist/Payload/
          cd dist && zip -qry "Attend-${{ needs.version.outputs.name }}-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: ios/dist/*.ipa

  publish:
    needs: [version, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Attend ${{ needs.version.outputs.name }}
          files: dist/*
          generate_release_notes: true
          body: |
            **Android:** most phones want `Attend-${{ needs.version.outputs.name }}-arm64-v8a.apk`; `-universal.apk` runs on everything.

            **iOS:** `Attend-${{ needs.version.outputs.name }}-unsigned.ipa` installs with [AltStore](https://altstore.io) or [SideStore](https://sidestore.io), which sign it with your own Apple ID. With a free Apple ID the app needs refreshing every 7 days (the tool does this for you), and widgets and NFC may not work.
