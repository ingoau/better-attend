name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android
      - name: Decode signing key
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ATTEND_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > release.jks
      - name: Unit & screenshot tests
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - name: Assemble release APK
        env:
          ATTEND_KEYSTORE_FILE: ${{ secrets.ATTEND_KEYSTORE_BASE64 != '' && 'release.jks' || '' }}
          ATTEND_KEYSTORE_PASSWORD: ${{ secrets.ATTEND_KEYSTORE_PASSWORD }}
          ATTEND_KEY_ALIAS: ${{ secrets.ATTEND_KEY_ALIAS }}
          ATTEND_KEY_PASSWORD: ${{ secrets.ATTEND_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: attend-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: android/app/build/outputs/roborazzi/*.png
          retention-days: 14
